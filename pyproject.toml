[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loralake"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "typer>=0.12",
    "pillow>=10",
    "numpy>=1.24",
    "polars>=1.0",
    "pyyaml>=6",
]

[project.scripts]
llk = "loralake.cli:app"

[tool.setuptools.packages.find]
include = ["loralake*"]

[tool.setuptools.package-data]
loralake = ["preprocess/*.html"]
