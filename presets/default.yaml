preprocess:
  trigger: ""
  exclude_images:
    - ai-generated
    - ai-assisted
    - lowres
    - jpeg_artifacts
    - bad_anatomy
    - bad_hands
    - bad_feet
    - bad_proportions
    - bad_perspective
  remove_tags: ["absurdres", "highres", "novel illustration", "official art"]
  prefix_tags: []
  include_rating: false
  include_year: false
  include_artist: false

train:
  rank: 32
  learning_rate: 2.0e-5
  epochs: 20
  batch_size: 16
  resolution: 1024
  save_every_epochs: 2
  optimizer: adamw_optimi
  caption_dropout: 0
  gradient_checkpointing: true
