preprocess:
  trigger: "lily (wuthering waves)"
  exclude_images:
    - ai-generated
    - ai-assisted
    - lowres
    - jpeg_artifacts
    - bad_anatomy
    - bad_hands
    - bad_feet
    - bad_proportions
    - bad_perspective
    - anatomical_nonsense
    - sketch
    - unfinished
  remove_tags: []
  prefix_tags: []
  include_rating: true
  include_year: true
  include_artist: true

train:
  rank: 32
  learning_rate: 2.0e-5
  epochs: 20
  batch_size: 4
  resolution: 1024
  save_every_epochs: 2
  optimizer: adamw_optimi
  caption_dropout: 0
  gradient_checkpointing: true
